<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111d" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonPurple2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="800" height="500" rx="16" fill="url(#gymBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <rect width="800" height="42" rx="16" fill="#0f172a" />
  <rect y="30" width="800" height="12" fill="#0f172a" />
  <circle cx="30" cy="21" r="5" fill="#ef4444" />
  <circle cx="48" cy="21" r="5" fill="#f59e0b" />
  <circle cx="66" cy="21" r="5" fill="#10b981" />
  <text x="400" y="25" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12" text-anchor="middle" font-weight="600">Gym Management Cloud System — Node.js • Express • MongoDB • JWT</text>

  <!-- Left Sidebar Navigation -->
  <rect x="18" y="58" width="160" height="424" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <rect x="30" y="78" width="136" height="24" rx="6" fill="url(#neonBlue)" />
  <text x="98" y="94" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">🏋️ Memberships</text>
  <rect x="30" y="112" width="136" height="24" rx="6" fill="#1e293b" />
  <text x="98" y="128" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">⚡ Trainer Allocations</text>
  <rect x="30" y="146" width="136" height="24" rx="6" fill="#1e293b" />
  <text x="98" y="162" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">💳 Subscription Plans</text>
  <rect x="30" y="180" width="136" height="24" rx="6" fill="#1e293b" />
  <text x="98" y="196" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">🔑 JWT Auth Tokens</text>

  <!-- Metrics Cards Row -->
  <rect x="194" y="58" width="186" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="210" y="80" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">ACTIVE GYM MEMBERS</text>
  <text x="210" y="110" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">842 Clients</text>

  <rect x="394" y="58" width="186" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="410" y="80" fill="#a855f7" font-family="sans-serif" font-size="10" font-weight="bold">CERTIFIED TRAINERS</text>
  <text x="410" y="110" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">28 Assigned</text>

  <rect x="594" y="58" width="188" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="610" y="80" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">MONGODB ATLAS</text>
  <text x="610" y="110" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">● REST API 200 OK</text>

  <!-- Member Lifecycle & Subscription Grid -->
  <rect x="194" y="146" width="588" height="336" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
  <text x="214" y="174" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Real-time Member Subscription &amp; Trainer Assignment</text>

  <!-- Member Cards Grid -->
  <!-- Card 1 -->
  <rect x="214" y="194" width="264" height="120" rx="8" fill="#111c38" stroke="#25355a" stroke-width="1" />
  <circle cx="240" cy="226" r="16" fill="#3b82f6" />
  <text x="240" y="231" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">RS</text>
  <text x="268" y="222" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Rahul Sharma</text>
  <text x="268" y="238" fill="#94a3b8" font-family="sans-serif" font-size="10">Plan: Platinum 12 Months</text>
  <text x="226" y="272" fill="#cbd5e1" font-family="sans-serif" font-size="10">Trainer: Coach Vikram (Strength)</text>
  <rect x="226" y="286" width="70" height="18" rx="4" fill="#065f46" />
  <text x="261" y="299" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">PAID • ACTIVE</text>

  <!-- Card 2 -->
  <rect x="498" y="194" width="264" height="120" rx="8" fill="#111c38" stroke="#25355a" stroke-width="1" />
  <circle cx="524" cy="226" r="16" fill="#a855f7" />
  <text x="524" y="231" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">AP</text>
  <text x="552" y="222" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Ananya Patel</text>
  <text x="552" y="238" fill="#94a3b8" font-family="sans-serif" font-size="10">Plan: Gold 6 Months</text>
  <text x="510" y="272" fill="#cbd5e1" font-family="sans-serif" font-size="10">Trainer: Coach Priya (Cardio/HIIT)</text>
  <rect x="510" y="286" width="70" height="18" rx="4" fill="#065f46" />
  <text x="545" y="299" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">PAID • ACTIVE</text>

  <!-- REST API Status Console Bar at bottom -->
  <rect x="214" y="330" width="548" height="136" rx="8" fill="#050814" stroke="#1b253b" stroke-width="1" />
  <text x="230" y="354" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">&gt; Node.js Express REST API Routes (JWT Authenticated):</text>
  <text x="230" y="378" fill="#a855f7" font-family="monospace" font-size="10">POST /api/auth/register → 201 Created (Password Hashed)</text>
  <text x="230" y="398" fill="#34d399" font-family="monospace" font-size="10">POST /api/auth/login → 200 OK (JWT Token Issued: Bearer eyJhbGci...)</text>
  <text x="230" y="418" fill="#38bdf8" font-family="monospace" font-size="10">GET /api/members/subscriptions → 200 OK (MongoDB Query 14ms)</text>
  <text x="230" y="438" fill="#f59e0b" font-family="monospace" font-size="10">PUT /api/trainers/assign/:memberId → 200 OK (Trainer Allocated)</text>
</svg>
