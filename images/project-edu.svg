  </defs>

  <!-- Background Frame -->
  <rect width="800" height="500" rx="16" fill="url(#bg)" stroke="#22283a" stroke-width="2" />

  <!-- Window Header -->
  <rect width="800" height="42" rx="16" fill="#0e1322" />
  <rect y="30" width="800" height="12" fill="#0e1322" />
  <circle cx="30" cy="21" r="5" fill="#ef4444" />
  <circle cx="48" cy="21" r="5" fill="#f59e0b" />
  <circle cx="66" cy="21" r="5" fill="#10b981" />
  <text x="400" y="25" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12" text-anchor="middle" font-weight="600">Online Education Management Portal — NetBeans &amp; MySQL</text>

  <!-- Left Sidebar -->
  <rect x="18" y="58" width="160" height="424" rx="10" fill="#0a0e1a" stroke="#1a2035" stroke-width="1" />
