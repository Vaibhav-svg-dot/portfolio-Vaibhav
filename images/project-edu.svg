  <text x="600" y="240" fill="#94a3b8" font-family="monospace" font-size="11">142</text>
  <rect x="696" y="228" width="56" height="18" rx="4" fill="#065f46" />
  <text x="724" y="241" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">ACTIVE</text>

  <!-- Row 2 -->
  <line x1="214" y1="258" x2="762" y2="258" stroke="#141c2e" stroke-width="1" />
  <text x="214" y="278" fill="#a855f7" font-family="monospace" font-size="11">#CS204</text>
  <text x="270" y="278" fill="#ffffff" font-family="sans-serif" font-size="11">Relational Database Systems (SQL)</text>
  <text x="460" y="278" fill="#cbd5e1" font-family="sans-serif" font-size="11">Prof. Gaikwad</text>
  <text x="600" y="278" fill="#94a3b8" font-family="monospace" font-size="11">198</text>
  <rect x="696" y="266" width="56" height="18" rx="4" fill="#065f46" />
  <text x="724" y="279" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">ACTIVE</text>

  <!-- Row 3 -->
  <line x1="214" y1="296" x2="762" y2="296" stroke="#141c2e" stroke-width="1" />
  <text x="214" y="316" fill="#a855f7" font-family="monospace" font-size="11">#CS308</text>
  <text x="270" y="316" fill="#ffffff" font-family="sans-serif" font-size="11">Object-Oriented Programming (Java)</text>
  <text x="460" y="316" fill="#cbd5e1" font-family="sans-serif" font-size="11">Dept. CS</text>
  <text x="600" y="316" fill="#94a3b8" font-family="monospace" font-size="11">160</text>
  <rect x="696" y="304" width="56" height="18" rx="4" fill="#065f46" />
  <text x="724" y="317" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">ACTIVE</text>

  <!-- Visual chart element at bottom of table -->
  <rect x="214" y="356" width="548" height="106" rx="8" fill="#060913" stroke="#141d2f" stroke-width="1" />
  <text x="230" y="380" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Weekly Student Activity Analytics</text>
  <!-- Chart bars -->
  <rect x="230" y="415" width="40" height="32" rx="3" fill="#6366f1" />
  <rect x="290" y="395" width="40" height="52" rx="3" fill="#8b5cf6" />
  <rect x="350" y="405" width="40" height="42" rx="3" fill="#a855f7" />
  <rect x="410" y="390" width="40" height="57" rx="3" fill="#06b6d4" />
  <rect x="470" y="410" width="40" height="37" rx="3" fill="#3b82f6" />
  <rect x="530" y="385" width="40" height="62" rx="3" fill="url(#purpleGrad)" />
  <rect x="590" y="400" width="40" height="47" rx="3" fill="#10b981" />
