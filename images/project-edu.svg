  <text x="210" y="110" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">1,248</text>

  <!-- Top Stat 2 -->
  <rect x="394" y="58" width="186" height="74" rx="10" fill="#0d1424" stroke="#1f2a44" stroke-width="1" />
  <text x="410" y="80" fill="#3b82f6" font-family="sans-serif" font-size="10" font-weight="bold">AVAILABLE COURSES</text>
  <text x="410" y="110" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">42 Modules</text>

  <!-- Top Stat 3 -->
  <rect x="594" y="58" width="188" height="74" rx="10" fill="#0d1424" stroke="#1f2a44" stroke-width="1" />
  <text x="610" y="80" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">MYSQL DATABASE</text>
  <text x="610" y="110" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">● Synchronized</text>

