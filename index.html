    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0px) scale(1);
    }

      opacity: 0;
      transform: translateX(-40px) scale(0.95);
      transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);

    // === PARTICLE BACKGROUND ===
    function ParticleBackground() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particleCount = Math.min(Math.floor((width * height) / 16000), 75);
        const particles = [];
        const colors = ['rgba(168, 85, 247, 0.45)', 'rgba(59, 130, 246, 0.45)', 'rgba(6, 182, 212, 0.4)'];

        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2 + 0.6,
            color: colors[Math.floor(Math.random() * colors.length)],
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 115) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(168, 85, 247, ${0.14 * (1 - dist / 115)})`;
                ctx.lineWidth = 0.6;
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
              }
            }
          }

          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
          });
          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-70" />;

                      <span className="w-2.5 h-2.5 rounded-full bg-[#27c93f]"></span>
                      <span className="ml-2 text-slate-300 font-semibold font-mono">Charismight_Platform_Operations.tsx</span>
                    </div>
                    <span className="text-emerald-400 font-mono">● LIVE PRODUCTION</span>
                  </div>

                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-6 border-b border-white/10">
                    <div className="flex items-center gap-3.5">
                      <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center font-display font-bold text-xl text-white shadow-md shadow-purple-950">
                        C
                      </div>
                      <div>
                        <h3 className="text-2xl font-bold text-white font-display">{portfolioData.charismightExperience.company}</h3>
                        <div className="text-sm font-semibold text-purple-300 font-mono">{portfolioData.charismightExperience.role}</div>
                      </div>
                    </div>
                    <div className="font-mono text-xs text-slate-400 bg-white/5 px-3 py-1.5 rounded-lg border border-white/5">{portfolioData.charismightExperience.period}</div>
                  </div>

                  <p className="text-slate-300 text-sm sm:text-base leading-relaxed font-light mt-4 mb-8">
                    {portfolioData.charismightExperience.overview}
                  </p>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {portfolioData.charismightExperience.platforms.map((platform) => (
                      <div key={platform.id} className="p-6 rounded-2xl bg-[#080c18] border border-white/10 hover:border-purple-500/50 transition-all group/plat shadow-lg">
                        <div className="flex items-center justify-between mb-3 pb-2 border-b border-white/5">
                          <h4 className="text-lg font-bold text-white font-display group-hover/plat:text-purple-300 transition-colors">{platform.name}</h4>
                          <span className="text-xs font-mono text-purple-400 bg-purple-950/40 px-2 py-0.5 rounded border border-purple-500/30">{platform.stack.join(' • ')}</span>
                        </div>
                        <div className="space-y-2 pt-2">
                          {platform.highlights.map((h, i) => (
                            <div key={i} className="flex items-center gap-2 text-xs sm:text-sm text-slate-300 font-light">
                              <span className="text-emerald-400 font-mono font-bold">&gt;</span>
                              <span>{h}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>

            {/* 7. SKILLS (Technologies I work with - Animated Tabs & Icon Tiles) */}
            <section id="skills" className="py-24 relative">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <SectionHeader
                  badge="SKILLS"
                  title="Technologies I"
                  highlight="work with."
                />

                {/* Animated Tabs */}
                <div className="flex flex-wrap items-center justify-center gap-2.5 mb-12 reveal">
                  {portfolioData.skillsCategories.map((cat) => {
                    const isSelected = cat.id === activeSkillTab;
                    return (
                      <button
                        key={cat.id}
                        onClick={() => setActiveSkillTab(cat.id)}
                        className={`px-5 py-2.5 rounded-xl text-xs font-mono transition-all duration-300 ${
                          isSelected
                            ? 'bg-purple-600/30 text-white border border-purple-500/60 shadow-lg shadow-purple-950 scale-105 font-bold'
                            : 'bg-white/5 text-slate-400 hover:text-slate-200 border border-white/10'
                        }`}
                      >
                        {cat.name}
                      </button>
                    );
                  })}
                </div>

                {/* Interactive Animated Tiles */}
                <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-4 gap-4 max-w-4xl mx-auto">
                  {portfolioData.skillsCategories.find((c) => c.id === activeSkillTab)?.skills.map((skill, idx) => (
                    <div
                      key={skill.name}
                      className={`glass-card p-5 rounded-2xl border border-white/10 text-center flex flex-col items-center justify-center gap-3 group reveal-pop delay-${(idx % 4 + 1) * 100} hover:border-purple-500/50`}
                    >
                      <div className="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span className="w-3.5 h-3.5 rounded-full" style={{ backgroundColor: skill.color }}></span>
                      </div>
                      <span className="text-sm font-bold text-white font-display group-hover:text-purple-300 transition-colors">{skill.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* 8. CERTIFICATIONS (With Real Certificate Photos & Interactive Lightbox) */}
            <section id="certifications" className="py-24 relative">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <SectionHeader
                  badge="CERTIFICATIONS"
                  title="My"
                  highlight="achievements."
                />

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {portfolioData.certifications.map((cert, idx) => (
                    <div key={cert.id} className={`glass-card rounded-3xl p-5 border border-white/10 flex flex-col justify-between group reveal-pop delay-${(idx + 1) * 100}`}>
                      <div>
                        {/* Real Certificate Photo Thumbnail */}
                        <div
                          onClick={() => setSelectedCertImg(cert.image)}
                          className="rounded-2xl overflow-hidden border border-white/10 mb-4 cursor-pointer relative group/img aspect-[4/3] bg-black/50"
                        >
                          <img src={cert.image} alt={cert.title} className="w-full h-full object-cover group-hover/img:scale-105 transition-transform duration-500" />
                          <div className="absolute inset-0 bg-purple-950/40 opacity-0 group-hover/img:opacity-100 transition-opacity flex items-center justify-center">
                            <span className="px-3 py-1 rounded-full bg-black/80 text-white text-xs font-mono">🔍 Expand Photo</span>
                          </div>
                        </div>

                        <div className="text-[11px] font-mono text-purple-400 mb-1">{cert.year}</div>
                        <h3 className="text-base font-bold text-white font-display mb-1 group-hover:text-purple-300 transition-colors">{cert.title}</h3>
                        <p className="text-slate-300 text-xs leading-relaxed font-light mb-4">{cert.description}</p>
                      </div>

                      <button
                        onClick={() => setSelectedCertImg(cert.image)}
                        className="w-full py-2 rounded-xl bg-white/5 hover:bg-purple-600/25 border border-white/10 text-xs font-mono text-slate-300 hover:text-white transition-all flex items-center justify-center gap-1.5"
                      >
                        <span>View Certificate Photo</span>
                        <svg className="w-3.5 h-3.5 fill-none stroke-current" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
                      </button>
                    </div>
                  ))}
                </div>

                {/* Certificate Lightbox Modal */}
                {selectedCertImg && (
                  <div onClick={() => setSelectedCertImg(null)} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md cursor-pointer">
                    <div className="relative max-w-4xl w-full rounded-2xl overflow-hidden border border-purple-500/40 shadow-2xl p-2 bg-[#0a0e1c]">
                      <img src={selectedCertImg} alt="Certificate Full View" className="w-full h-auto rounded-xl" />
                      <button onClick={() => setSelectedCertImg(null)} className="absolute top-4 right-4 bg-black/80 text-white p-2 rounded-full font-mono text-xs border border-white/20">✕ Close</button>
                    </div>
                  </div>
                )}
              </div>
            </section>

            {/* 9. EDUCATION (Academic Journey with Semester SGPA Cards) */}
            <section id="education" className="py-24 relative">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <SectionHeader
                  badge="EDUCATION"
                  title="My academic"
                  highlight="journey."
                />

                <div className="max-w-4xl mx-auto reveal-pop">
                  <div className="glass-card rounded-3xl p-6 sm:p-10 border border-white/10 relative overflow-hidden">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-white/10">
                      <div>
                        <h3 className="text-xl sm:text-2xl font-bold text-white font-display">{portfolioData.education.degree}</h3>
                        <div className="text-sm font-semibold text-purple-300 font-display mt-0.5">{portfolioData.education.institution}</div>
                      </div>
                      <div className="font-mono text-xs text-purple-400 font-semibold">{portfolioData.education.period}</div>
                    </div>

                    {/* Semester SGPA 6-Grid Matrix */}
                    <div className="pt-6">
                      <div className="text-xs font-mono uppercase tracking-wider text-slate-400 mb-3">Semester SGPA Performance:</div>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
                        {portfolioData.education.semesters.map((s) => (
                          <div key={s.sem} className="p-3.5 rounded-xl bg-black/40 border border-white/5 flex items-center justify-between">
                            <span className="text-xs font-mono text-slate-400">{s.sem}</span>
                            <span className="text-sm font-mono font-bold text-cyan-400">{s.gpa}</span>
                          </div>
                        ))}
                      </div>

                      {/* Secondary Education */}
                      <div className="space-y-2 pt-2 border-t border-white/5">
                        {portfolioData.education.secondary.map((sec, i) => (
                          <div key={i} className="flex items-center justify-between text-xs font-mono text-slate-300 p-2 rounded-lg bg-white/5">
                            <span>{sec.title} — {sec.school}</span>
                            <span className="text-purple-400 font-bold">{sec.score}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* 10. CONTACT / LET'S CONNECT */}
            <section id="contact" className="py-24 relative overflow-hidden">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                <SectionHeader
                  badge="LET'S CONNECT"
                  title="Let's build something"
                  highlight="amazing together."
                />

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  
                  {/* Direct Contact */}
                  <div className="lg:col-span-5 space-y-6 reveal-left">
                    <div className="glass-card rounded-3xl p-6 sm:p-8 border border-white/10 relative overflow-hidden">
                      
                      {/* Geometric 3D 'V.' Emblem */}
                      <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-purple-600 via-indigo-600 to-cyan-500 p-[1px] mb-6 shadow-lg shadow-purple-900/40">
                        <div className="w-full h-full bg-[#070a14] rounded-[15px] flex items-center justify-center font-display font-black text-2xl text-white">
                          V<span className="text-cyan-400">.</span>
                        </div>
                      </div>

                      <h3 className="text-xl font-bold text-white font-display mb-2">Connect Directly</h3>
                      <p className="text-slate-400 text-sm font-light leading-relaxed mb-6">
                        Open for digital initiatives, full-stack development, and professional collaborations.
                      </p>

                      <div className="space-y-3">
                        <div className="p-3.5 rounded-xl bg-black/40 border border-white/10 flex items-center justify-between gap-2">
                          <div className="min-w-0">
                            <div className="text-[10px] font-mono text-slate-400 uppercase">Email</div>
                            <div className="text-xs font-mono text-purple-300 truncate">{portfolioData.contactInfo.email}</div>
                          </div>
                          <button onClick={copyEmail} className="p-2 rounded-lg bg-purple-950/60 hover:bg-purple-900 border border-purple-500/30 text-purple-300 text-xs font-mono shrink-0">
                            {emailCopied ? 'Copied!' : 'Copy'}
                          </button>
                        </div>

                        {portfolioData.contactInfo.socials.map((s) => (
                          <a key={s.name} href={s.url} target="_blank" rel="noopener noreferrer" className="p-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-between text-xs font-mono text-slate-300 hover:text-white transition-all">
                            <span>{s.display}</span>
                            <span className="text-purple-400">↗</span>
                          </a>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Message Transmission Form */}
                  <div className="lg:col-span-7 reveal-right">
                    <div className="glass-card rounded-3xl p-6 sm:p-8 border border-white/10">
                      <h3 className="text-xl font-bold text-white font-display mb-2">Send a Message</h3>
                      <p className="text-slate-400 text-sm font-light mb-6">Fill out the transmission form below to send an inquiry directly.</p>

                                            {formSent ? (
                        <div className="p-6 rounded-2xl bg-emerald-950/40 border border-emerald-500/40 text-center space-y-2 reveal-pop active">
                          <div className="text-emerald-400 text-lg font-bold">Transmission Received!</div>
                          <p className="text-xs sm:text-sm text-emerald-300">Thank you for reaching out. I will respond to your message promptly.</p>
                        </div>
                      ) : (
                        <form onSubmit={handleFormSubmit} className="space-y-4">
                          {formError && (
                            <div className="p-3 rounded-xl bg-rose-950/40 border border-rose-500/40 text-rose-300 text-xs font-mono">
                              Something went wrong sending your message. Please try again or email me directly.
                            </div>
                          )}
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-mono text-slate-300 uppercase mb-1.5">Your Name</label>
                              <input name="name" type="text" required placeholder="e.g. Alex Smith" className="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 focus:border-purple-500/70 focus:outline-none text-sm text-white font-sans placeholder:text-slate-600 transition-colors" />
                            </div>
                            <div>
                              <label className="block text-xs font-mono text-slate-300 uppercase mb-1.5">Email Address</label>
                              <input name="email" type="email" required placeholder="alex@example.com" className="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 focus:border-purple-500/70 focus:outline-none text-sm text-white font-sans placeholder:text-slate-600 transition-colors" />
                            </div>
                          </div>
                          <div>
                            <label className="block text-xs font-mono text-slate-300 uppercase mb-1.5">Message</label>
                            <textarea name="message" required rows="4" placeholder="Hi Vaibhav, I would like to discuss..." className="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 focus:border-purple-500/70 focus:outline-none text-sm text-white font-sans placeholder:text-slate-600 transition-colors resize-none"></textarea>
                          </div>
                          <button type="submit" disabled={formSubmitting} className="w-full py-3.5 rounded-xl cyber-btn-primary font-mono text-xs font-semibold text-white disabled:opacity-60 disabled:cursor-not-allowed">
                            {formSubmitting ? 'Sending...' : 'Transmit Message'}
                          </button>
                        </form>
                      )}
                    </div>
                  </div>

                </div>
              </div>
            </section>

          </main>

          {/* FOOTER */}
          <footer className="border-t border-white/10 bg-[#04060d] py-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400">
              <div>&copy; {new Date().getFullYear()} {portfolioData.personalInfo.name}. All rights reserved.</div>
              <div className="font-mono text-slate-400">Designed &amp; Built with React, Tailwind &amp; Cyber System</div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
